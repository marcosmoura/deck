name: Release

on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - "**/Cargo.toml"
      - Cargo.lock
      - .mise.toml
      - .github/workflows/release.yml

permissions:
  contents: read

jobs:
  build:
    strategy:
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-15
          - target: x86_64-apple-darwin
            os: macos-15-intel
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-22.04-arm
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: jdx/mise-action@v3
        with:
          install_args: rust zig
      - name: Check the tag matches the workspace version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version="$(cargo pkgid -p deck | sed 's/.*[#@]//')"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "tag $GITHUB_REF_NAME does not match the workspace version $version" >&2
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
      - name: Build
        run: cargo build --release --locked -p deck --target ${{ matrix.target }}
      - name: Package
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          name="deck-$VERSION-${{ matrix.target }}"
          mkdir -p "dist/$name"
          cp "target/${{ matrix.target }}/release/deck" README.md "dist/$name/"
          tar -C dist -czf "dist/$name.tar.gz" "$name"
          cd dist
          shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256"
      - if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: deck-${{ matrix.target }}
          path: dist/*.tar.gz*

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --generate-notes --verify-tag
