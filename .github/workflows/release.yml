name: Release

on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - "**/Cargo.toml"
      - Cargo.lock
      - .mise.toml
      - mise.lock
      - .github/workflows/release.yml

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  # mise installs a tool only as mise.lock records it, and checks the download against it.
  MISE_LOCKED: "1"

jobs:
  build:
    strategy:
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-15
          - target: x86_64-apple-darwin
            os: macos-15-intel
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-22.04-arm
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      # No cache: what a release is built with is downloaded for that release.
      - uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # v3.6.3
        with:
          version: 2026.11.13
          install_args: rust zig
          cache: false
      # A pull request has no tag: it builds and packs the workspace version, and uploads nothing.
      - name: Read the workspace version, which a tag must match
        run: |
          version="$(cargo pkgid -p deck | sed 's/.*[#@]//')"
          case "$GITHUB_REF" in
            refs/tags/v*)
              if [ "v$version" != "$GITHUB_REF_NAME" ]; then
                echo "tag $GITHUB_REF_NAME does not match the workspace version $version" >&2
                exit 1
              fi
              ;;
          esac
          echo "VERSION=$version" >> "$GITHUB_ENV"
      - name: Build
        run: cargo build --release --locked -p deck --target ${{ matrix.target }}
      - name: Package
        run: |
          name="deck-$VERSION-${{ matrix.target }}"
          mkdir -p "dist/$name"
          cp "target/${{ matrix.target }}/release/deck" README.md LICENSE "dist/$name/"
          tar -C dist -czf "dist/$name.tar.gz" "$name"
          cd dist
          shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256"
      - if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: deck-${{ matrix.target }}
          path: dist/*.tar.gz*

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: dist
          merge-multiple: true
      # release-please creates the release when it tags; a tag pushed by hand has none.
      - name: Upload to the release, creating it when missing
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --generate-notes --verify-tag
          fi

  # Writes Formula/deck.rb in the tap. A failure here leaves the release as it is: rerun the job.
  homebrew:
    needs: publish
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - name: Download the checksums
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release download "$GITHUB_REF_NAME" --pattern '*.sha256' --dir sums
      - name: Render the formula
        run: |
          version="${GITHUB_REF_NAME#v}"
          sh packaging/homebrew/render.sh "$version" sums > deck.rb
          echo "VERSION=$version" >> "$GITHUB_ENV"
      # The tap's shared action creates or updates the file; any other project publishes the same way.
      # It has no releases: the pin is a commit of the tap's `main`, moved by hand to take a fix.
      - name: Publish it to the tap
        uses: marcosmoura/homebrew-tap/.github/actions/publish@a2ff0e50a6e36c2511dba1cfd0dd57ccafb27813 # main, 24 Nov 2026
        with:
          file: deck.rb
          path: Formula/deck.rb
          message: deck ${{ env.VERSION }}
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
