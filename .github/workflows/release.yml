name: Release

on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - "**/Cargo.toml"
      - Cargo.lock
      - .mise.toml
      - .github/workflows/release.yml

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    strategy:
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-15
          - target: x86_64-apple-darwin
            os: macos-15-intel
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-22.04-arm
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: jdx/mise-action@v3
        with:
          install_args: rust zig
      - name: Check the tag matches the workspace version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version="$(cargo pkgid -p deck | sed 's/.*[#@]//')"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "tag $GITHUB_REF_NAME does not match the workspace version $version" >&2
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
      - name: Build
        run: cargo build --release --locked -p deck --target ${{ matrix.target }}
      - name: Package
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          name="deck-$VERSION-${{ matrix.target }}"
          mkdir -p "dist/$name"
          cp "target/${{ matrix.target }}/release/deck" README.md "dist/$name/"
          tar -C dist -czf "dist/$name.tar.gz" "$name"
          cd dist
          shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256"
      - if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: deck-${{ matrix.target }}
          path: dist/*.tar.gz*

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      # release-please creates the release when it tags; a tag pushed by hand has none.
      - name: Upload to the release, creating it when missing
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --generate-notes --verify-tag
          fi

  # Writes Formula/deck.rb in the tap. A failure here leaves the release as it is: rerun the job.
  homebrew:
    needs: publish
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Download the checksums
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release download "$GITHUB_REF_NAME" --pattern '*.sha256' --dir sums
      - name: Render the formula and write it to the tap
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          TAP: marcosmoura/homebrew-tap
        run: |
          version="${GITHUB_REF_NAME#v}"
          sh packaging/homebrew/render.sh "$version" sums > deck.rb
          # The current blob's sha is needed to update the file; a 404 means create it.
          # Any other error (an expired token, say) fails the job.
          err="$RUNNER_TEMP/gh-err"
          if ! sha="$(gh api "repos/$TAP/contents/Formula/deck.rb" --jq .sha 2>"$err")"; then
            grep -q 'HTTP 404' "$err" || { cat "$err" >&2; exit 1; }
            sha=""
          fi
          base64 -w0 deck.rb | jq -Rs \
            --arg message "deck $version" \
            --arg sha "$sha" \
            '{message: $message, content: .} + (if $sha == "" then {} else {sha: $sha} end)' |
            gh api --method PUT "repos/$TAP/contents/Formula/deck.rb" --input - >/dev/null
