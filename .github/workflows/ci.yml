name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  # mise installs a tool only as mise.lock records it, and checks the download against it.
  MISE_LOCKED: "1"

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
        with:
          version: 2026.11.13
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: just check
      - name: Lint the workflows and shell scripts
        if: runner.os == 'Linux'
        run: just lint-ci
      # The advisory database changes by itself: a failure here with no change to the
      # dependencies is fixed by an update or a reasoned ignore in deny.toml.
      - name: Audit the dependencies
        if: runner.os == 'Linux'
        run: just audit
