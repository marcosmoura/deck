name: Release Please

on:
  push:
    branches:
      - main
      - "release-please--branches--main*"

permissions:
  contents: read

env:
  # mise installs a tool only as mise.lock records it, and checks the download against it.
  MISE_LOCKED: "1"

jobs:
  release-please:
    if: github.ref_name == 'main'
    runs-on: ubuntu-24.04
    steps:
      # A personal access token, not GITHUB_TOKEN: pull requests and tags made with
      # GITHUB_TOKEN trigger no workflows, so CI and release.yml would never run.
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}

  # On release-please's branch: refresh Cargo.lock and format CHANGELOG.md, which
  # release-please leaves stale or unformatted. A push with nothing to fix commits nothing.
  # Never touches main. Each changed file is its own commit and CI run; each new push cancels
  # the previous fix-up run.
  #
  # Two jobs, so the release token never shares a runner with the checkout and the tools:
  # `prepare` runs them without any secret and uploads what changed; `commit` holds the token
  # and runs only the artifact download and `gh`.
  prepare:
    if: startsWith(github.ref_name, 'release-please--branches--main')
    runs-on: ubuntu-24.04
    concurrency:
      group: release-please-fix-up
      cancel-in-progress: true
    outputs:
      changed: ${{ steps.collect.outputs.changed }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # v3.6.3
        with:
          version: 2026.11.13
          install_args: rust aqua:oxc-project/oxc/oxfmt
      # release-please writes these files in its own format, which `oxfmt --check` (in
      # `just check`) rejects; Cargo.lock follows the version in Cargo.toml.
      - name: Refresh Cargo.lock and format what release-please wrote
        run: |
          oxfmt CHANGELOG.md .release-please-manifest.json Cargo.toml
          cargo update --workspace
      # Each changed file, and beside it the blob it replaces (the contents API asks for it).
      - name: Collect what changed
        id: collect
        run: |
          mkdir fixed
          changed=false
          for file in Cargo.lock CHANGELOG.md .release-please-manifest.json Cargo.toml; do
            if git diff --quiet -- "$file"; then
              continue
            fi
            cp "$file" "fixed/$file"
            git rev-parse "HEAD:$file" > "fixed/$file.sha"
            changed=true
          done
          echo "changed=$changed" >> "$GITHUB_OUTPUT"
      - if: steps.collect.outputs.changed == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fix-up
          path: fixed/
          include-hidden-files: true
          retention-days: 1

  # Commits through the API as the token's owner, so CI runs again.
  commit:
    needs: prepare
    if: needs.prepare.outputs.changed == 'true'
    runs-on: ubuntu-24.04
    # Never cancels: when the `prepare` of a newer push is running, this job waits for it.
    # That `prepare` cancels this job if it is already running.
    concurrency:
      group: release-please-fix-up
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: fix-up
          path: fixed
      - name: Commit what changed
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          GH_REPO: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
        run: |
          for file in Cargo.lock CHANGELOG.md .release-please-manifest.json Cargo.toml; do
            if [ ! -f "fixed/$file" ]; then
              continue
            fi
            # The body goes through stdin: Cargo.lock in base64 is too long for one argument.
            base64 -w0 "fixed/$file" | jq -Rs \
              --arg message "chore(repo): update $file" \
              --arg sha "$(tr -d '\n' < "fixed/$file.sha")" \
              --arg branch "$BRANCH" \
              '{message: $message, content: ., sha: $sha, branch: $branch}' |
              gh api --method PUT "repos/$GH_REPO/contents/$file" --input - >/dev/null
          done
