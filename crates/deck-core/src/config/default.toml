# deck configuration. Every key is optional; the values below are the defaults.

# The prefix key that starts a binding. On macOS, Option+Space needs Option to act as Alt in
# the terminal; the non-breaking space some terminals send instead is accepted too. Launchers
# such as Raycast and Alfred may claim Option+Space: change either one.
prefix = "M-Space"

# The shell for new terminals; unset means $SHELL, else /bin/sh.
# shell = "/bin/zsh"

# Arguments passed to the shell.
shell_args = ["-l"]

# Lines of scrollback kept per terminal.
scrollback_lines = 10000

# The sidebar of projects and panels: shown or hidden, and its width in columns (20 to 60).
# It also hides while the window is narrower than its width plus 21 columns.
sidebar = true
sidebar_width = 28

# How deck tells you, through the outer terminal, that an agent needs you or finished while
# you were not looking: "osc9" (a desktop notification in iTerm2, Ghostty and WezTerm; other
# terminals ignore it), "bell", or "none". Inside tmux or over ssh, OSC 9 reaches the desktop
# only if they pass it through.
notify = "osc9"

# After a daemon restart (deck kill-server, a reboot), reopen each terminal's coding agent on
# its conversation: a shell terminal runs the agent's resume command first and then your
# shell; a terminal started with an explicit agent command runs the resume command instead.
resume_agents = true

# Key bindings, pressed after the prefix. An action takes one key or a list of keys, and
# replaces that action's default keys; [] unbinds the action. A key you set for an action
# is taken from any other action that only has it by default, with a warning; one key set
# on two of your actions is an error.
[keys]
detach = "d" # Detach from the session
sessions = "s" # Switch, create or kill sessions
rename_session = "$" # Rename the session
restore = "R" # Restore an agent session
scroll = "[" # Scroll back through the history
new_terminal = "t" # New terminal in the panel
close_terminal = "x" # Close the focused terminal
focus_left = ["Left", "h"] # Focus the terminal on the left
focus_right = ["Right", "l"] # Focus the terminal on the right
focus_up = ["Up", "k"] # Focus the terminal above
focus_down = ["Down", "j"] # Focus the terminal below
resize_left = "H" # Resize the focused terminal to the left
resize_right = "L" # Resize the focused terminal to the right
resize_up = "K" # Resize the focused terminal upward
resize_down = "J" # Resize the focused terminal downward
reset_layout = "=" # Reset the panel's terminal sizes
new_panel = "c" # New panel
next_panel = "n" # Next panel
prev_panel = "p" # Previous panel
panel_1 = "1" # Focus panel 1
panel_2 = "2" # Focus panel 2
panel_3 = "3" # Focus panel 3
panel_4 = "4" # Focus panel 4
panel_5 = "5" # Focus panel 5
panel_6 = "6" # Focus panel 6
panel_7 = "7" # Focus panel 7
panel_8 = "8" # Focus panel 8
panel_9 = "9" # Focus panel 9
rename_panel = "," # Rename the panel
close_panel = "X" # Close the panel
new_project = "P" # New project
new_menu = "N" # New panel menu: shell or agent
rename_project = "." # Rename the project
close_project = "Q" # Close the project
toggle_sidebar = "b" # Show or hide the sidebar
focus_sidebar = "Tab" # Move focus into the sidebar
next_attention = "a" # Jump to the next agent that needs you
help = "?" # This help

# Colours and glyphs of deck's own UI; terminal contents keep their programs' colours.
# A colour is "default" (the terminal's own), a name (black, red, green, yellow, blue,
# magenta, cyan, white and their bright- forms), a number 0 to 255 (the 256-colour palette),
# "#rrggbb", or the name of another role. Without truecolor, "#rrggbb" is drawn as the
# nearest palette colour.
[theme]
accent = "blue" # focused border and title, active panel row, session name
muted = "bright-black" # hints, project names, empty states, exited terminals
ok = "green" # success states
warning = "yellow" # PREFIX, SCROLL and RESIZE badges, scroll indicator
error = "red" # error flashes
border = "bright-black" # unfocused terminal borders and the sidebar separator
border_focused = "accent" # the focused terminal's border
title = "default" # unfocused terminal titles
sidebar_fg = "default" # sidebar text
sidebar_bg = "default" # sidebar background
status_fg = "default" # status bar text
status_bg = "default" # status bar background
selection_fg = "default" # selected row text (reversed while both selection roles are default)
selection_bg = "default" # selected row background
overlay_bg = "default" # help and picker overlays
# rounded, plain, thick or double: borders of terminals and overlays.
border_style = "rounded"
# unicode, nerd or none: the icon in front of each panel's name, chosen by what runs in it
# (an agent, or a program such as nvim, lazygit or ssh; a terminal icon otherwise). `unicode`
# uses glyphs every font has, `nerd` needs a Nerd Font, `none` draws no icons.
icons = "unicode"
# auto or off: in Ghostty and kitty `auto` draws the logos of Claude Code, Codex and OpenCode
# as images in place of their icons (not inside tmux, Zellij or a deck panel, and not without
# truecolor); `off` keeps the text icons. Ignored with icons = "none".
icon_images = "auto"

# One cell wide each.
[theme.glyphs]
expanded = "▾" # a project that shows its panels
collapsed = "▸" # a project that hides its panels
active = "▌" # the active panel's marker
spinner = ["⠋", "⠙", "⠹", "⠸", "⠼", "⠴", "⠦", "⠧", "⠇", "⠏"] # a working agent: frames, 100 ms each
waiting = "!" # an agent that needs you (warning colour, bold)
idle = "●" # an agent that finished its turn (ok colour)
quiet = "○" # an agent found by its process that is not printing (muted)
unseen = "•" # a panel whose agent needed you or finished while you were not looking (accent)

# One cell wide each. Uncomment a line to change one icon of the preset; with
# icons = "none" they are still checked but not drawn.
[theme.icon_glyphs]
# claude = "✻" # Claude Code (nerd: U+EC82)
# codex = "◎" # Codex (nerd: U+EC81)
# opencode = "◇" # OpenCode (nerd: ▣, U+25A3)
# terminal = "❯" # a shell and every program without an icon of its own (nerd: U+F120)
# editor = "✎" # vi, vim, nvim, hx, helix, nano, emacs, micro, kak (nerd: U+F040)
# git = "±" # git, lazygit, tig, gitui (nerd: U+F126)
# monitor = "◔" # top, htop, btop, glances (nerd: U+F0E4)
# remote = "⇄" # ssh, mosh, et (nerd: U+F0EC)
# build = "▲" # cargo, make, just, npm, pnpm, yarn, go (nerd: U+F013)
# pager = "¶" # less, more, man, bat (nerd: U+F02D)
# repl = "λ" # python, python3, node, irb, ghci, iex (nerd: U+F121)

# How deck recognises each coding agent in a terminal: the program names (the command as
# typed, or the script that node, bun, deno, sh, bash, zsh or dash runs, without extension)
# whose process in the foreground of the terminal means that agent.
#
# `resume` reopens a conversation and `resume_latest` the most recent one, which is used when
# the session id is unknown or not a plain id. A template is a program and arguments split on
# whitespace; `{session_id}` is allowed only as a whole argument of `resume`. Quotes,
# backslashes, `$`, backticks and other shell syntax are errors: the command is joined with
# spaces and run by `sh -c`. With several agents of one kind in one directory and no session
# ids, each one runs `resume_latest`.
#
# `command` is what a new panel for that agent runs (the `New` menu), directly and with no
# shell, in the project's directory. It is a program and arguments split on whitespace, with
# the same restrictions and no `{session_id}`; a program with a `/` must be an absolute path.
# A program that is not in `process` is not detected as the agent, so a daemon restart
# relaunches it fresh instead of resuming it.
[agents.claude]
process = ["claude"] # Claude Code
command = "claude"
resume = "claude --resume {session_id}"
resume_latest = "claude --continue"

[agents.codex]
process = ["codex"] # Codex
command = "codex"
resume = "codex resume {session_id}"
resume_latest = "codex resume --last"

[agents.opencode]
process = ["opencode"] # OpenCode
command = "opencode"
resume = "opencode --session {session_id}"
resume_latest = "opencode --continue"
