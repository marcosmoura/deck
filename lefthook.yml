pre-commit:
  commands:
    fmt:
      glob: "*.rs"
      run: cargo fmt --all --check
    oxfmt:
      glob: "*.{md,toml,json,jsonc,yml,yaml}"
      run: oxfmt --check {staged_files}

commit-msg:
  commands:
    conventional:
      run: |
        header=$(head -n 1 "{1}")
        re='^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\((core|daemon|tui|cli|spec|agents|repo|deps|docs)\))?: [^A-Z](.*[^.])?$'
        if [ "${#header}" -le 100 ] && printf '%s\n' "$header" | grep -Eq "$re"; then
          exit 0
        fi
        echo "Commit header must be: <type>(<scope>): <subject>" >&2
        echo "  types: feat fix docs style refactor perf test build ci chore revert" >&2
        echo "  scopes (optional): core daemon tui cli spec agents repo deps docs" >&2
        echo "  imperative lower-case subject, no trailing period, header at most 100 characters" >&2
        exit 1
