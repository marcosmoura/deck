[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.100"
license = "MIT"

[workspace.dependencies]
serde = "1.0.229"
postcard = { version = "1.2.0", default-features = false }
serde_json = "1.0.154"
toml = "1.2.2"
thiserror = "2.0.21"
anyhow = "1.0.104"
tokio = "1.54.1"
portable-pty = "0.9.0"
alacritty_terminal = "0.26.0"
ghostty-vt = { version = "=0.9.0", default-features = false }
ratatui = "0.30.2"
clap = "4.6.9"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
libc = "0.2.191"
unicode-width = "0.2.3"
tempfile = "3.27.0"

[workspace.lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
